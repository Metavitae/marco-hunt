name: Android build

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rules tests (72 checks, 1000 AI games)
        run: |
          mkdir -p engine/build/main engine/build/test
          javac -d engine/build/main $(find engine/src/main -name "*.java")
          javac -cp engine/build/main -d engine/build/test engine/src/test/java/com/metavitae/marcohunt/engine/Tests.java
          java -cp engine/build/main:engine/build/test com.metavitae.marcohunt.engine.Tests

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      # A GitHub Release per build (artifact storage on this account is full and shared by all projects).
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MarcoHunt-0.8-b${{ github.run_number }}.apk
          gh release create "b${{ github.run_number }}" MarcoHunt-0.8-b${{ github.run_number }}.apk \
            --prerelease --title "Marco Hunt 0.8 build ${{ github.run_number }}" \
            --notes "Test build (test-only signing key). Commit ${{ github.sha }}."
